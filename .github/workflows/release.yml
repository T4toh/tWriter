name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # Crea el draft UNA vez y le pasa el id a los builds. Sin esto los cuatro
  # jobs buscaban el draft en paralelo, no lo encontraban, y cada uno creaba
  # el suyo: dos drafts con la mitad de los assets y un latest.json a medias.
  create-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Crear draft
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > body.md <<'EOF'
          **Linux (Arch / CachyOS)**: instalá vía AUR — `yay -S twriter-bin`. Auto-update con `yay -Syu`.

          **Linux (Debian / Ubuntu)**: descargar `.deb` y `sudo apt install ./twriter_*.deb`.

          **Herramientas opcionales (todas las plataformas)**: la app anda sin ellas y avisa adentro cuándo faltan.
          · `pandoc` — importar `.docx`/`.odt`.
          · `epubcheck` — validar el EPUB al exportarlo, el mismo chequeo que corre la tienda al recibirlo (`sudo pacman -S epubcheck` en Arch, `brew install epubcheck` en macOS, [release](https://github.com/w3c/epubcheck/releases) a mano en Windows; necesita Java 11+).
          · un runtime de containers — LanguageTool para gramática (ver abajo en macOS).

          **Windows**: descargar el `.exe` (instalador NSIS).

          **macOS (Apple Silicon)**: descargar el `.dmg` con `aarch64`. **macOS (Intel)**: descargar el `.dmg` con `x64`.
          La app está firmada ad-hoc (sin notarización de Apple): en el primer arranque hacé **click derecho → Abrir**, o corré `xattr -dr com.apple.quarantine /Applications/tWriter.app`.
          Las herramientas opcionales van con Homebrew: `brew install pandoc epubcheck`.

          **macOS — LanguageTool (gramática)**: la app levanta LanguageTool en un container y autodetecta el runtime que tengas. Elegí uno: Apple container (`brew install container && container system start`), colima (`brew install colima docker && colima start`) o Podman (`brew install podman && podman machine init && podman machine start`). Si usás Docker y antes tuviste Docker Desktop desinstalado, borrá la línea `"credsStore": "desktop"` de `~/.docker/config.json` (rompe el `docker pull`).
          EOF
          # Idempotente: si el draft ya existe (re-run del workflow), lo reusa.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            # El id sale de la respuesta del POST. Volver a listar recién
            # creado no lo encontraba (v0.14.0): id vacío, tauri-action decía
            # «No releaseId or tagName provided, skipping all uploads» y los
            # cuatro builds terminaban en verde sin subir nada.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="tWriter $TAG" -F draft=true \
                   -F body=@body.md --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::no pude obtener el release_id para $TAG"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  build-macos:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin   # Apple Silicon (Macs nuevas)
          - target: x86_64-apple-darwin    # Intel (PC vieja, cross-compile desde ARM)
    # Ambos targets corren en el runner ARM (macos-14): los runners Intel
    # GitHub-hosted (macos-13) escasean y la cola queda colgada. Apple Silicon
    # trae los dos SDKs, así que x86_64 cross-compila sin emulación.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
