name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --user root
    permissions:
      contents: write
    steps:
      - name: Install Arch deps
        # Build dentro de container Arch para que las libs bundleadas (webkit,
        # gtk, libavif) coincidan con Mesa moderno del usuario final
        # (CachyOS/Arch). Ubuntu 22.04/24.04 traen webkit2gtk demasiado viejo
        # y crashean EGL en Wayland Plasma 6.
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git curl wget tar \
            nodejs npm pnpm rust \
            webkit2gtk-4.1 gtk3 \
            libayatana-appindicator librsvg \
            openssl patchelf fuse2 file squashfs-tools \
            xdg-utils desktop-file-utils \
            github-cli

      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Pre-cache patched linuxdeploy-gtk hook
        # Hook upstream fuerza GDK_BACKEND=x11 incondicional → crash EGL en
        # Wayland moderno. Patch: solo forzar x11 si NO hay sesión Wayland.
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            | sed 's|^export GDK_BACKEND=x11|[ -z "$WAYLAND_DISPLAY" ] \&\& export GDK_BACKEND=x11|' \
            > ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          grep -n "GDK_BACKEND" ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # FUSE no funciona en GH Actions container → linuxdeploy se extrae
          # primero en lugar de mountear.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'tWriter ${{ github.ref_name }}'
          releaseBody: |
            Auto-update: la app instalada chequea esta release al arrancar.

            Linux: descargar `.AppImage` (recomendado) o `.deb`.
            Windows: descargar `.msi` o `.exe` (NSIS).
          releaseDraft: true
          prerelease: false

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'tWriter ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
