# Instaladores de Windows y de Mac Intel para probar un PR en una máquina
# real, sin release ni tag. Se dispara poniéndole al PR la etiqueta «build de
# prueba» (y se rehace con cada push mientras la tenga), o a mano desde Actions
# sobre main. Cada instalador queda como artifact del run, 7 días.
#
# Sin firma de código, igual que los de release: Windows muestra SmartScreen
# («Más información» → «Ejecutar de todas formas») y macOS pide abrirlo con
# clic derecho → Abrir.
name: Build de prueba

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

# Un push nuevo cancela el build anterior del mismo PR.
concurrency:
  group: build-prueba-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build de prueba')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # La key firma los artefactos del updater (createUpdaterArtifacts), no el .exe.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: twriter-windows-${{ github.event.pull_request.number || github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # Cross-compila desde el runner ARM, como release.yml: los runners Intel
  # escasean y la cola queda colgada.
  mac-intel:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build de prueba')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: x86_64-apple-darwin

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-apple-darwin --bundles dmg

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: twriter-mac-intel-${{ github.event.pull_request.number || github.ref_name }}
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
