@if (editing(); as node) {
  <div class="bc-backdrop" (click)="close()"></div>
  <div class="bc-modal" (click)="$event.stopPropagation()">
    <header class="bc-header">
      <h2>Configurar saga</h2>
      <p class="path">{{ node.name }}</p>
    </header>

    @if (config(); as c) {
      <div class="bc-body">
        <div class="row">
          <label>
            <span>Nombre</span>
            <input
              type="text"
              [ngModel]="c.nombre"
              (ngModelChange)="update('nombre', $event)"
              placeholder="Nombre de la saga"
            />
          </label>
        </div>
        <div class="row">
          <label class="checkbox">
            <input
              type="checkbox"
              [ngModel]="c.finalizada"
              (ngModelChange)="update('finalizada', $event)"
            />
            <span>Saga finalizada (oculta el creador de novelas)</span>
          </label>
        </div>
        <div class="row split">
          <label>
            <span>Autor</span>
            <input
              type="text"
              [ngModel]="c.autor"
              (ngModelChange)="update('autor', $event)"
              placeholder="Heredado a libros nuevos"
            />
          </label>
          <label>
            <span>Idioma</span>
            <select
              [ngModel]="c.idioma"
              (ngModelChange)="update('idioma', $event)"
            >
              <option value="es">Español</option>
              <option value="en">Inglés</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>
            <span>Tapa de saga (imagen)</span>
            <div class="cover-row">
              <input
                type="text"
                [ngModel]="c.tapa"
                (ngModelChange)="update('tapa', $event)"
                placeholder="ej: cover.png o ruta absoluta"
              />
              <button type="button" (click)="pickCover()">Buscar…</button>
            </div>
          </label>
        </div>
        <div class="row">
          <label>
            <span>Diccionario (una palabra por línea)</span>
            <textarea
              [ngModel]="diccionarioText()"
              (ngModelChange)="updateDiccionarioText($event)"
              rows="6"
              placeholder="nombres propios, neologismos, palabras del mundo de la saga"
            ></textarea>
          </label>
        </div>

        <div class="row section-divider">
          <span class="section-label">Defaults heredados a libros nuevos</span>
        </div>
        <div class="row">
          <label>
            <span>Imprenta</span>
            <input
              type="text"
              [ngModel]="c.imprenta"
              (ngModelChange)="update('imprenta', $event)"
              placeholder="Independiente"
            />
          </label>
        </div>
        <div class="row split">
          <label>
            <span>Tamaño de página (EPUB)</span>
            <select
              [ngModel]="c.template ?? '6x9'"
              (ngModelChange)="update('template', $event)"
            >
              <option value="6x9">6 × 9 in (default)</option>
              <option value="5x8">5 × 8 in</option>
              <option value="a5">A5 (148 × 210 mm)</option>
            </select>
          </label>
          <label>
            <span>Prefijo del capítulo</span>
            <select
              [ngModel]="c.prefijo_capitulo"
              (ngModelChange)="update('prefijo_capitulo', $event)"
            >
              <option value="none">Sin prefijo</option>
              <option value="decimal">Número (1, 2, 3…)</option>
              <option value="roman">Romano (I, II, III…)</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label class="checkbox">
            <input
              type="checkbox"
              [ngModel]="c.mostrar_titulo_capitulo"
              (ngModelChange)="update('mostrar_titulo_capitulo', $event)"
            />
            <span>Mostrar título del capítulo</span>
          </label>
        </div>
        <div class="row">
          <label class="checkbox">
            <input
              type="checkbox"
              [ngModel]="c.dropcap"
              (ngModelChange)="update('dropcap', $event)"
            />
            <span>Letrina (dropcap) en primer párrafo de cada capítulo</span>
          </label>
        </div>
        <div class="row split">
          <label class="checkbox">
            <input
              type="checkbox"
              [ngModel]="c.mostrar_numero_parte"
              (ngModelChange)="update('mostrar_numero_parte', $event)"
            />
            <span>Mostrar header de parte</span>
          </label>
          <label>
            <span>Formato de parte</span>
            <select
              [ngModel]="c.formato_parte"
              (ngModelChange)="update('formato_parte', $event)"
              [disabled]="!c.mostrar_numero_parte"
            >
              <option value="raw">1</option>
              <option value="parte">Parte 1</option>
              <option value="punto">1.</option>
            </select>
          </label>
        </div>

        @if (error(); as err) {
          <p class="error">{{ err }}</p>
        }
      </div>
    } @else if (error(); as err) {
      <p class="error">{{ err }}</p>
    } @else {
      <p class="loading">Cargando…</p>
    }

    <footer class="bc-actions">
      <button type="button" class="btn btn-secondary" (click)="close()">Cancelar</button>
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="saving() || !config()"
        (click)="save()"
      >
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </div>
}
