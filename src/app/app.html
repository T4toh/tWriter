<div class="shell">
  <aside class="panel panel-left">
    <header>
      <div class="title-row">
        <img src="assets/icon.png" alt="tWriter" class="app-icon" />
        <div class="actions">
          <button
            type="button"
            class="icon-btn sync-btn"
            [class.spinning]="git.syncing()"
            (click)="syncNow()"
            [disabled]="!root() || git.syncing() || git.state() === 'clean'"
            [title]="syncTitle()"
          >
            ⇅
          </button>
          <button
            type="button"
            class="icon-btn"
            (click)="pull()"
            [disabled]="!root() || git.syncing()"
            title="Pull desde remoto (fast-forward, sin merge)"
          >
            ⤓
          </button>
          <button
            type="button"
            class="icon-btn"
            (click)="refresh()"
            [disabled]="!root()"
            title="Recargar árbol"
          >
            ↻
          </button>
          <button
            type="button"
            class="icon-btn"
            (click)="createSaga()"
            [disabled]="!root()"
            title="Crear saga / novela"
          >
            ＋
          </button>
          <button
            type="button"
            class="icon-btn"
            (click)="pickFolder()"
            title="Cambiar carpeta"
          >
            📁
          </button>
          <button
            type="button"
            class="icon-btn"
            [class.active]="debug.visible()"
            (click)="toggleDebug()"
            title="Panel de debug"
          >
            🐛
          </button>
        </div>
      </div>
      @if (root(); as r) {
        <div class="path-row" [title]="syncTitle()">
          <span class="dot" [attr.data-state]="git.state()"></span>
          <span class="path" [title]="r">{{ r }}</span>
        </div>
        <div class="sync-summary" [class.error]="git.state() === 'error'">
          {{ git.error() ?? git.summary() }}
        </div>
      } @else {
        <span class="path muted">sin carpeta</span>
      }
    </header>
    <app-tree />
  </aside>

  <main class="panel panel-center">
    <app-editor />
  </main>
</div>

<app-debug-panel />
<app-book-config-modal />
<app-toast-container />
