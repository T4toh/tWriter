<div class="shell">
  <aside class="panel panel-left">
    <header>
      <div class="title-row">
        <span class="title">tWriter</span>
        <div class="actions">
          <button
            type="button"
            class="icon-btn"
            (click)="refresh()"
            [disabled]="!root()"
            title="Recargar árbol"
          >
            ↻
          </button>
          <button
            type="button"
            class="icon-btn"
            (click)="pickFolder()"
            title="Cambiar carpeta"
          >
            📁
          </button>
        </div>
      </div>
      @if (root(); as r) {
        <span class="path" [title]="r">{{ r }}</span>
      } @else {
        <span class="path muted">sin carpeta</span>
      }
    </header>
    <app-tree />
  </aside>

  <main class="panel panel-center">
    <app-editor />
  </main>
</div>
