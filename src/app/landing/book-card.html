<button
  type="button"
  class="book-card"
  [class.vertical]="layout() === 'vertical'"
  [class.horizontal]="layout() === 'horizontal'"
  [class.unconfigured]="!isConfigured()"
  (click)="onClick()"
>
  <div class="cover-slot">
    @if (coverDataUrl(); as url) {
      <img [src]="url" [alt]="displayTitle()" />
    } @else {
      <div class="cover-placeholder">
        <span>{{ displayTitle() }}</span>
      </div>
    }
  </div>
  <div class="info">
    <h3 class="title">{{ displayTitle() }}</h3>
    @if (subtitle(); as sub) {
      <p class="subtitle">{{ sub }}</p>
    }
    @if (layout() === 'horizontal' && author(); as a) {
      <p class="author">{{ a }}</p>
    }
    <div class="foot">
      <div class="foot-meta">
        <span class="date">{{ node().modifiedMs | fechaCorta }}</span>
        <span class="count">
          {{ chapterCount() }} cap.
          @if (node().wordCount; as w) {
            · {{ formatWords(w) }}
          }
        </span>
      </div>
      <div class="card-actions">
        <button
          type="button"
          class="card-btn"
          (click)="openConfig($event)"
          title="Configurar novela"
        >
          <svg lucideSettings [size]="16"></svg>
        </button>
        <button
          type="button"
          class="card-btn"
          (click)="abrirRevision($event)"
          title="Revisar y corregir la novela"
        >
          <svg lucideListChecks [size]="16"></svg>
        </button>
        <button
          type="button"
          class="card-btn"
          [disabled]="exporting()"
          (click)="exportEpub($event)"
          title="Exportar a EPUB"
        >
          @if (exporting()) {
            <app-spinner [size]="14" />
          } @else {
            <svg lucideArrowDownToLine [size]="16"></svg>
          }
        </button>
      </div>
    </div>
    @if (!isConfigured()) {
      <p class="hint">Sin configurar</p>
    }
  </div>
</button>
